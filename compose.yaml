services:
  postgres:
    image: 'postgres:16'
    ##
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: profile_bankend:1.0
    depends_on:
      postgres:
        condition: service_healthy
  ## 设置环境变量，给application.yaml使用
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/mydatabase
      - DB_USER=myuser
      - DB_PASSWORD=secret
    ports:
      - '8081:8081'

volumes:
  pgdata:
