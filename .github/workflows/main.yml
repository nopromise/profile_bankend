name: Docker Build and Push to Aliyun

on:
  push:
    branches:
      - master  # 保持你原有的 master 分支触发

jobs:
  # ==========================================
  # Job 1: 持续集成与镜像打包 (CI 阶段)
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    # 这一步很关键：将打包出来的唯一 Tag 变成这个 Job 的输出变量，方便下一个 Job 引用
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Aliyun ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ vars.REGISTRY }}
          username: ${{ vars.ALIBABA_CLOUD_USERNAME }}
          password: ${{ secrets.ALIBABA_CLOUD_PASSWORD }}

      # 设置唯一的 Tag：大厂标准做法，取 GitHub SHA 的前 7 位作为短哈希，避免 latest 的坑
      - name: Set Short SHA Tag
        id: set-tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=${{ vars.REGISTRY }}/finn_test/profile_bankend          
          IMAGE_TAG=${{ steps.set-tag.outputs.tag }}
          
          # 构建并推送基于唯一 Git SHA 的镜像
          docker build -t $IMAGE_NAME:$IMAGE_TAG .          
          docker push $IMAGE_NAME:$IMAGE_TAG          
          
          # 保留你的 latest 备份，但 K8s 之后将不再依赖它
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

  # ==========================================
  # Job 2: 衔接阶段 —— 自动化修改 K8s 配置仓库 (CD 的桥梁)
  # ==========================================
  update-k8s-manifest:
    needs: build-and-push # 必须等上面镜像推成功后，才执行本任务
    runs-on: ubuntu-latest
    steps:
      # 步骤一：克隆你的【K8s 配置仓库】（注意：填入你自己的 GitHub 账号和新仓库名）
      - name: Checkout Manifest Repo
        uses: actions/checkout@v3
        with:
          repository: 'nopromise/profile-manifests' # 👈 修改为你的配置仓库路径
          token: ${{ secrets.MY_GITHUB_TOKEN }} # 👈 动用我们刚才配置的超级通行证

      # 步骤二：使用 Linux 的 sed 命令，把 YAML 里的旧标签/占位符替换成最新的短 SHA 标签
      - name: Update Image Tag in YAML
        run: |
          NEW_TAG=${{ needs.build-and-push.outputs.image_tag }}
          TARGET_FILE="k8s/backend-k8s.yaml"
          
          echo "开始将 $TARGET_FILE 中的镜像标签更新为: $NEW_TAG"
          
          # 使用 sed 正则替换镜像行：找到 profile_bankend:后面的任何字符，替换为新的 $NEW_TAG
          sed -i "s|image: ${{ vars.REGISTRY }}/finn_test/profile_bankend:.*|image: ${{ vars.REGISTRY }}/finn_test/profile_bankend:$NEW_TAG|g" $TARGET_FILE

      # 步骤三：把被修改后的部署 YAML 文件，自动 Commit 并 Push 回你的配置仓库
      - name: Commit and Push to Manifest Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add k8s/backend-k8s.yaml
          git commit -m "chore: 自动化更新后端镜像标签至 ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push origin main # 或者 master，取决于你配置仓库的主分支名叫什么